<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素机甲对战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <div id="startScreen" class="screen start-screen">
            <h1 class="game-title">像素机甲对战</h1>
            <div class="controls-info">
                <div class="player-controls">
                    <h2 class="player-title blue">玩家 1 (蓝色)</h2>
                    <ul>
                        <li><kbd>W</kbd> 上</li>
                        <li><kbd>A</kbd> 左</li>
                        <li><kbd>S</kbd> 下</li>
                        <li><kbd>D</kbd> 右</li>
                        <li><kbd>空格</kbd> 攻击</li>
                        <li><kbd>Shift</kbd> 防御</li>
                    </ul>
                </div>
                <div class="vs">VS</div>
                <div class="player-controls">
                    <h2 class="player-title red">玩家 2 (红色)</h2>
                    <ul>
                        <li><kbd>↑</kbd> 上</li>
                        <li><kbd>←</kbd> 左</li>
                        <li><kbd>↓</kbd> 下</li>
                        <li><kbd>→</kbd> 右</li>
                        <li><kbd>Enter</kbd> 攻击</li>
                        <li><kbd>Ctrl</kbd> 防御</li>
                    </ul>
                </div>
            </div>
            <button id="startBtn" class="pixel-btn">开始游戏</button>
        </div>

        <div id="gameScreen" class="screen game-screen hidden">
            <div class="hud">
                <div class="player-info blue">
                    <div class="player-name">玩家 1</div>
                    <div class="health-bar-container">
                        <div class="health-bar-bg"></div>
                        <div id="health1" class="health-bar"></div>
                    </div>
                    <div id="status1" class="status">待机</div>
                </div>
                <canvas id="gameCanvas" width="800" height="500"></canvas>
                <div class="player-info red">
                    <div class="player-name">玩家 2</div>
                    <div class="health-bar-container">
                        <div class="health-bar-bg"></div>
                        <div id="health2" class="health-bar"></div>
                    </div>
                    <div id="status2" class="status">待机</div>
                </div>
            </div>
            <div class="game-controls">
                <button id="pauseBtn" class="pixel-btn">暂停</button>
                <button id="restartBtn" class="pixel-btn">重新开始</button>
            </div>
        </div>

        <div id="endScreen" class="screen end-screen hidden">
            <h1 id="winnerText" class="game-title"></h1>
            <button id="playAgainBtn" class="pixel-btn">再来一局</button>
        </div>
    </div>

    <script src="js/mech.js"></script>
    <script src="js/input.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
